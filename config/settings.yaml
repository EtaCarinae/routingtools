address_cleaner:
  country_codes: "es"
  quality_high_threshold: 0.80
  quality_low_threshold: 0.50
  nominatim_rps: 1.0
  bbox_ceiling_deg2: 0.01
  dedupe_decimal_places: 5
  escalation_provider: "opencage"   # opencage | google
  arbiter_model: "mistralai/mistral-small-3.2-24b-instruct"
  abbreviations:
    "c/": "calle"
    "avda.": "avenida"
    "av.": "avenida"
    "pº": "paseo"
    "ctra.": "carretera"
    "s/n": ""
    "pza.": "plaza"
    "pol.": "poligono"
    "urb.": "urbanizacion"
